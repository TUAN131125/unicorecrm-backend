name: Platform CI

on:
  pull_request:
    paths:
      - ".github/workflows/platform-ci.yml"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".config/dotnet-tools.json"
      - "UnicoreCRM.slnx"
      - "src/**"
      - "scripts/**"
      - "docs/architecture/CURRENT_IMPLEMENTATION_AUTHORITY.md"
      - "docs/architecture/PLATFORM_CI_QUALITY_GATE.md"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/platform-ci.yml"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".config/dotnet-tools.json"
      - "UnicoreCRM.slnx"
      - "src/**"
      - "scripts/**"
      - "docs/architecture/CURRENT_IMPLEMENTATION_AUTHORITY.md"
      - "docs/architecture/PLATFORM_CI_QUALITY_GATE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-platform-verification:
    name: Required Platform verification
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run required Platform gate
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-platform-ci.ps1 `
            -EvidenceDirectory artifacts/platform-ci `
            -RunId "${{ github.run_id }}_${{ github.run_attempt }}"
          exit $LASTEXITCODE

      - name: Publish commit-bound verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-ci-evidence-${{ github.sha }}
          path: artifacts/platform-ci
          if-no-files-found: error
          retention-days: 14
